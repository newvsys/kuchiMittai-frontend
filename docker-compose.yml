services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend

    container_name: frontend

    working_dir: /app

    ports:
      - "3000:3000"
      - "9229:9229"

    command: sh -c "npm install && npm run dev"

    volumes:
      - .:/app
      - /app/node_modules

    environment:
      # Next.js hot reload settings
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"

      # Debug settings
      DEBUG: "*"
      NEXTAUTH_DEBUG: "true"

      # API configuration
      # Browser side calls
      NEXT_PUBLIC_API_BASE_URL: "http://localhost:8080/api"

      # Next.js server-side calls (Docker to Docker)
      API_BASE_URL: "http://app:8080/api"

      # NextAuth
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "12D16C923BA17672F89B18C1DB22A"

      # Firebase Cloud Messaging (FCM) push notifications
      # Replace the values below with your actual Firebase project settings.
      # Find them in: Firebase Console → Project Settings → Your apps → Config
      # VAPID key: Firebase Console → Project Settings → Cloud Messaging → Web Push certificates
      NEXT_PUBLIC_FIREBASE_API_KEY: "AIzaSyCyP423eiCnHr-mFJzMp1bOEEJ3CMXXWyE"
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "kuchimittai-dd858.firebaseapp.com"
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: "kuchimittai-dd858"
      NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: "kuchimittai-dd858.firebasestorage.app"
      NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: "643913111147"
      NEXT_PUBLIC_FIREBASE_APP_ID: "1:643913111147:web:276432e92cdca25632432e"
      NEXT_PUBLIC_FIREBASE_VAPID_KEY: "BDQ5KYa65kBN6h30LJThhYlorhtNyRxzStj_U7nkJTYlJGYkg3Z5sKcRYBzyBSuEHChY4323-W8RHrZanJ113bA"

      NODE_ENV: "development"

    networks:
      - mynetwork


networks:
  mynetwork:
    external: true